services:
  - type: web
    name: prediction-ai-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_ENGINE
        value: postgresql
